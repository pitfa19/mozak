name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish release assets for (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify tag matches package and Obsidian manifest versions
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          EXPECTED="${TAG_NAME#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          ROOT_MAN_VER="$(node -p "require('./manifest.json').version")"
          OBS_MAN_VER="$(node -p "require('./packages/obsidian/dist/plugin/manifest.json').version")"
          if [ "$EXPECTED" != "$PKG_VER" ] || [ "$EXPECTED" != "$ROOT_MAN_VER" ] || [ "$EXPECTED" != "$OBS_MAN_VER" ]; then
            echo "Version mismatch: tag=$EXPECTED package=$PKG_VER root-manifest=$ROOT_MAN_VER plugin-manifest=$OBS_MAN_VER" >&2
            exit 1
          fi
          for f in main.js manifest.json styles.css; do
            test -s "packages/obsidian/dist/plugin/$f" || { echo "Missing plugin asset: $f" >&2; exit 1; }
          done
      - run: GIT_CONFIG_GLOBAL=/dev/null npm test
      - name: Publish GitHub Release with Obsidian plugin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          # The CLI updater uses vX.Y.Z tags. Obsidian downloads assets using
          # the exact manifest version, X.Y.Z. Both tags identify this commit.
          RELEASE_TAG="${TAG_NAME#v}"
          TARGET_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$TARGET_SHA" || {
              echo "Refusing to change existing release tag $RELEASE_TAG" >&2
              exit 1
            }
          fi
          ASSETS=(
            "packages/obsidian/dist/plugin/main.js"
            "packages/obsidian/dist/plugin/manifest.json"
            "packages/obsidian/dist/plugin/styles.css"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" --target "$TARGET_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
