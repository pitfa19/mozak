name: Publish MOZAK

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: mozak-release-${{ github.ref_type == 'branch' && 'main' || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-linux-x86-64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Must match rust-toolchain.toml, which otherwise overrides this install
          # and leaves the requested target attached to a different toolchain.
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
      - name: Select channel and verify stable version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/mozak-cli/Cargo.toml | head -1)
          [[ -n "$version" ]] || { echo "cannot read Cargo package version" >&2; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2; exit 1; }
            echo 'channel=stable' >> "$GITHUB_OUTPUT"
          else
            echo 'channel=main' >> "$GITHUB_OUTPUT"
          fi
      - name: Build static binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p mozak-cli
      - name: Build release assets
        run: scripts/build_linux_release.sh target/x86_64-unknown-linux-musl/release/mozak dist '${{ steps.release.outputs.channel }}' "$GITHUB_SHA" "$GITHUB_REPOSITORY"
      - name: Verify archive checksum
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Publish stable release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --latest
      - name: Replace rolling main prerelease
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete main --cleanup-tag --yes || true
          git tag -f main "$GITHUB_SHA"
          git push origin refs/tags/main --force
          # Pushing a tag and GitHub serving it are not simultaneous. Creating
          # the release immediately raced and failed with "tag main exists
          # locally but has not been pushed". --target names the commit
          # directly, so the release does not depend on tag propagation.
          gh release create main dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MOZAK main (${GITHUB_SHA::12})" \
            --notes "Rolling build from main at $GITHUB_SHA."
