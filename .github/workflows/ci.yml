name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Must match rust-toolchain.toml so components attach to the toolchain
          # that actually runs.
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Python tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build release binary
        run: cargo build --release -p mozak-cli
      - name: Docs match the binary
        run: python3 scripts/check_docs_match_binary.py
      - name: Fresh-machine packaged acceptance
        run: python3 scripts/test_fresh_machine_release.py target/release/mozak
      - name: Delivery install-update-rollback acceptance
        run: python3 scripts/test_delivery_update.py target/release/mozak
      - name: GitHub bootstrap acceptance
        run: python3 scripts/test_github_bootstrap.py target/release/mozak
