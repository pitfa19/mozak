<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
  <title id="t">MOZAK</title>
  <desc id="d">The MOZAK brain-circuit mark on a dark tile, with three circuit endpoints lit in gold, purple and green, next to the name MOZAK and the tagline: You own the plan. The agent does the work.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b2e"/>
      <stop offset="1" stop-color="#0f0d18"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b931"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34c06f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon tile -->
  <g transform="translate(40 50)">
    <rect width="200" height="200" rx="44" fill="url(#tile)"/>
    <rect x="1.5" y="1.5" width="197" height="197" rx="42.5" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".85"/>
    <!-- Lucide brain-circuit (ISC), scaled from a 24 unit grid -->
    <g transform="translate(28 28) scale(6)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
      <g stroke="#f4f1ff">
        <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
        <path d="M9 13a4.5 4.5 0 0 0 3-4"/>
        <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/>
        <path d="M3.477 10.896a4 4 0 0 1 .585-.396"/>
        <path d="M6 18a4 4 0 0 1-1.967-.516"/>
      </g>
      <!-- Circuits: gold = all, purple = open, green = done -->
      <path d="M12 8h8" stroke="#e8b931"/>
      <path d="M16 8V5a2 2 0 0 1 2-2" stroke="#e8b931"/>
      <path d="M12 13h4" stroke="#a78bfa"/>
      <path d="M12 18h6a2 2 0 0 1 2 2v1" stroke="#34c06f"/>
      <g filter="url(#glow)" stroke="none">
        <circle cx="20" cy="8" r="1.15" fill="#e8b931"/>
        <circle cx="18" cy="3" r="1.15" fill="#e8b931"/>
        <circle cx="16.4" cy="13" r="1.15" fill="#a78bfa"/>
        <circle cx="20" cy="21" r="1.15" fill="#34c06f"/>
      </g>
    </g>
  </g>

  <!-- Wordmark: neutral grey reads on GitHub light and dark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="284" y="150" font-size="96" font-weight="800" letter-spacing="6" fill="#8b5cf6">MOZAK</text>
    <text x="288" y="200" font-size="27" font-weight="500" fill="#8a8794">You own the plan. The agent does the work.</text>
    <g transform="translate(288 228)" font-size="17" font-weight="600">
      <circle cx="6" cy="-6" r="6" fill="#e8b931"/><text x="18" y="0" fill="#8a8794">all</text>
      <circle cx="66" cy="-6" r="6" fill="#a78bfa"/><text x="78" y="0" fill="#8a8794">open</text>
      <circle cx="140" cy="-6" r="6" fill="#34c06f"/><text x="152" y="0" fill="#8a8794">done</text>
    </g>
  </g>
</svg>
