[workspace]
members = ["crates/mozak-core", "crates/mozak-cli", "crates/mozak-mcp"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pitfa19/mozak"
readme = "README.md"

[workspace.dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
